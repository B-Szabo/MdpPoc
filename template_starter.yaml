AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: mdp-poc-ingestion Isolated Producer Lambda, Trigger, and SQS Queue.

Resources:
  # ==========================================
  # 1. INGESTION QUEUE
  # ==========================================
  MdpPocIngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: mdp-poc-ingest-queue
      Tags:
        - Key: cost_tag
          Value: mdp_poc

  # ==========================================
  # 2. PRODUCER LAMBDA
  # ==========================================
  MdpPocProducerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: mdp-poc-producer
      Description: Generates 10 EV records/min with a unified schema and time compression.
      Handler: index.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 10
      Tags:
        cost_tag: mdp_poc
      Environment:
        Variables:
          INGEST_QUEUE_URL: !Ref MdpPocIngestQueue
          # Configuration for Time Compression
          # IMPORTANT: Update WORKSHOP_START_EPOCH to the current Unix timestamp right before your workshop starts!
          WORKSHOP_START_EPOCH: "1714420000" 
          SYNTHETIC_START_EPOCH: "1767225600" # Epoch for January 1, 2026, 00:00:00 UTC
          TIME_MULTIPLIER: "168"              # 1 real minute = 168 synthetic minutes
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MdpPocIngestQueue.QueueName
      Events:
        Timer:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(1 minute)"
            Description: Triggers the producer lambda every minute
      InlineCode: |
        import json
        import boto3
        import os
        import random
        import uuid
        import time
        from datetime import datetime, timezone, timedelta

        sqs = boto3.client('sqs')
        queue_url = os.environ['INGEST_QUEUE_URL']
        
        # Load Time Configuration from Environment
        WORKSHOP_START_EPOCH = int(os.environ['WORKSHOP_START_EPOCH'])
        SYNTHETIC_START_EPOCH = int(os.environ['SYNTHETIC_START_EPOCH'])
        TIME_MULTIPLIER = int(os.environ['TIME_MULTIPLIER'])
        
        CHARGERS = [f"charger-{str(i).zfill(3)}" for i in range(1, 11)]

        def generate_event_id():
            return uuid.uuid4().hex[:12].upper()

        def get_timestamp_with_offset(record_index):
            current_real_epoch = time.time()
            elapsed_real_seconds = current_real_epoch - WORKSHOP_START_EPOCH
            
            if elapsed_real_seconds < 0:
                elapsed_real_seconds = 0
                
            # Scale the elapsed time
            elapsed_synthetic_seconds = elapsed_real_seconds * TIME_MULTIPLIER
            current_synthetic_epoch = SYNTHETIC_START_EPOCH + elapsed_synthetic_seconds
            
            # Convert to datetime object
            base_dt = datetime.fromtimestamp(current_synthetic_epoch, timezone.utc)
            
            # Add micro-offset so all 10 records in the batch don't have the exact same synthetic second
            # Spread them evenly across the simulated time window (e.g., across 168 minutes)
            minutes_to_add = record_index * (TIME_MULTIPLIER / 10)
            final_dt = base_dt + timedelta(minutes=minutes_to_add)
            
            return final_dt.strftime("%Y-%m-%dT%H:%M:%SZ")

        def generate_base_event(charger_id, event_type, record_index):
            # The Unified "Flat and Wide" Schema Initializer
            return {
                "event_id": generate_event_id(),
                "event_time": get_timestamp_with_offset(record_index),
                "charger_id": charger_id,
                "event_type": event_type,
                "connector_id": None,
                "status": None,
                "temperature_c": None,
                "voltage_v": None,
                "current_a": None,
                "session_id": None,
                "vehicle_id": None,
                "state": None,
                "power_kw": None,
                "energy_kwh_total": None,
                "fault_code": None,
                "severity": None,
                "message": None
            }

        def generate_telemetry(charger_id, record_index):
            event = generate_base_event(charger_id, "telemetry", record_index)
            status = random.choices(["available", "charging", "faulted"], weights=[70, 25, 5])[0]
            
            event["connector_id"] = random.choice([1, 2])
            event["status"] = status
            event["temperature_c"] = round(random.uniform(25.0, 45.0) + (15.0 if status == "charging" else 0.0), 1)
            event["voltage_v"] = round(random.uniform(395.0, 405.0), 1)
            event["current_a"] = round(random.uniform(16.0, 200.0), 1) if status == "charging" else 0.0
            
            return event

        def generate_session(charger_id, record_index):
            event = generate_base_event(charger_id, "session", record_index)
            # Use the synthetic time to generate the session ID prefix
            synthetic_time_str = event["event_time"]
            date_str = datetime.strptime(synthetic_time_str, "%Y-%m-%dT%H:%M:%SZ").strftime('%Y%m%d')
            
            state = random.choices(["starting", "charging", "completed"], weights=[10, 70, 20])[0]
            
            event["connector_id"] = random.choice([1, 2])
            event["session_id"] = f"sess-{date_str}-{random.randint(1000,9999)}"
            event["vehicle_id"] = f"veh-{random.randint(1000, 1999)}"
            event["state"] = state
            event["power_kw"] = round(random.uniform(11.0, 150.0), 1) if state != "completed" else 0.0
            event["energy_kwh_total"] = round(random.uniform(5.0, 75.0), 1) if state != "starting" else round(random.uniform(0.1, 2.0), 1)
            
            return event

        def generate_fault(charger_id, record_index):
            event = generate_base_event(charger_id, "fault", record_index)
            faults = [
                ("E_OVERCURRENT", "critical", "Overcurrent detected, charging stopped", random.choice([1, 2])),
                ("E_TEMP_HIGH", "warning", "Thermal limit approached, throttling power", random.choice([1, 2])),
                ("E_COMMS_LOSS", "warning", "Backend connection lost", None)
            ]
            f_code, f_sev, f_msg, conn_id = random.choice(faults)
            
            event["connector_id"] = conn_id
            event["fault_code"] = f_code
            event["severity"] = f_sev
            event["message"] = f_msg
            
            return event

        def handler(event, context):
            entries = []
            
            # Generate exactly 10 records per minute
            for i in range(10):
                charger_id = random.choice(CHARGERS)
                event_type = random.choices(['telemetry', 'session', 'fault'], weights=[70, 20, 10])[0]
                
                if event_type == 'telemetry':
                    payload = generate_telemetry(charger_id, i)
                elif event_type == 'session':
                    payload = generate_session(charger_id, i)
                else:
                    payload = generate_fault(charger_id, i)

                entries.append({
                    'Id': str(uuid.uuid4()),
                    'MessageBody': json.dumps(payload)
                })

            # Send all 10 records in a single SQS batch
            response = sqs.send_message_batch(
                QueueUrl=queue_url,
                Entries=entries
            )
            
            success_count = len(response.get('Successful', []))
            print(f"Sent batch. Total Successful: {success_count}/10")
            
            return {
                "statusCode": 200,
                "body": f"Batch process complete. {success_count}/10 delivered."
            }

Outputs:
  QueueURL:
    Description: "URL of the Ingest SQS Queue"
    Value: !Ref MdpPocIngestQueue
  ProducerLambdaArn:
    Description: "ARN of the Producer Lambda Function"
    Value: !GetAtt MdpPocProducerFunction.Arn
