AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: mdp-poc-ingestion Producer with High Traffic (40% Day / 20% Night).

Resources:
  # ==========================================
  # 1. INGESTION QUEUE
  # ==========================================
  MdpPocIngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: mdp-poc-ingest-queue
      Tags:
        - Key: cost_tag
          Value: mdp_poc

  # ==========================================
  # 2. DYNAMODB STATE TABLE
  # ==========================================
  MdpPocChargerStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: mdp-poc-charger-state
      AttributeDefinitions:
        - AttributeName: charger_id
          AttributeType: S
      KeySchema:
        - AttributeName: charger_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: cost_tag
          Value: mdp_poc

  # ==========================================
  # 3. PRODUCER LAMBDA
  # ==========================================
  MdpPocProducerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: mdp-poc-producer
      Description: Generates highly varied EV records with a high traffic curve.
      Handler: index.handler
      Runtime: python3.13
      MemorySize: 512
      Timeout: 15
      Tags:
        cost_tag: mdp_poc
      Environment:
        Variables:
          INGEST_QUEUE_URL: !Ref MdpPocIngestQueue
          STATE_TABLE_NAME: !Ref MdpPocChargerStateTable
          WORKSHOP_START_EPOCH: "1778070600" 
          SYNTHETIC_START_EPOCH: "1735689600"
          TIME_MULTIPLIER: "10" 
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MdpPocIngestQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref MdpPocChargerStateTable
      Events:
        Timer:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(1 minute)"
            Description: Triggers the producer lambda every minute
      InlineCode: |
        import json
        import boto3
        import os
        import random
        import uuid
        import time
        from decimal import Decimal
        from datetime import datetime, timezone, timedelta
        
        sqs = boto3.client('sqs')
        dynamodb = boto3.resource('dynamodb')
        
        queue_url = os.environ['INGEST_QUEUE_URL']
        table_name = os.environ['STATE_TABLE_NAME']
        table = dynamodb.Table(table_name)
        
        WORKSHOP_START_EPOCH = int(os.environ['WORKSHOP_START_EPOCH'])
        SYNTHETIC_START_EPOCH = int(os.environ['SYNTHETIC_START_EPOCH'])
        TIME_MULTIPLIER = int(os.environ['TIME_MULTIPLIER'])
        
        CHARGERS = [f"charger-{str(i).zfill(3)}" for i in range(1, 11)]

        CHARGER_SPECS = {
            f"charger-{str(i).zfill(3)}": {
                "power_kw": Decimal('150.0') if i > 5 else Decimal('50.0'),
                "voltage": 800.0 if i > 5 else 400.0
            } for i in range(1, 11)
        }

        POSSIBLE_FAULTS = [
            {"code": "E_TEMP_HIGH", "sev": "warning", "msg": "Thermal limit approached"},
            {"code": "E_COMMS_LOSS", "sev": "critical", "msg": "Backend connection lost"},
            {"code": "E_OVERCURRENT", "sev": "critical", "msg": "Overcurrent detected, charging stopped"},
            {"code": "E_GROUND_FAULT", "sev": "critical", "msg": "Ground fault detected, safety trip"},
            {"code": "E_READER_FAIL", "sev": "warning", "msg": "RFID/Payment reader timeout"}
        ]

        class DecimalEncoder(json.JSONEncoder):
            def default(self, obj):
                if isinstance(obj, Decimal):
                    return float(obj)
                return super(DecimalEncoder, self).default(obj)

        def generate_event_id():
            return uuid.uuid4().hex[:12].upper()

        def get_current_synthetic_epoch():
            current_real_epoch = time.time()
            elapsed_real_seconds = max(0, current_real_epoch - WORKSHOP_START_EPOCH)
            elapsed_synthetic_seconds = elapsed_real_seconds * TIME_MULTIPLIER
            return SYNTHETIC_START_EPOCH + elapsed_synthetic_seconds

        def get_event_timestamp(synthetic_epoch, index_offset):
            offset_seconds = index_offset * (TIME_MULTIPLIER / 10)
            dt = datetime.fromtimestamp(synthetic_epoch + offset_seconds, timezone.utc)
            return dt.strftime("%Y-%m-%dT%H:%M:%SZ")

        def fetch_states():
            response = dynamodb.meta.client.batch_get_item(
                RequestItems={
                    table_name: {
                        'Keys': [{'charger_id': cid} for cid in CHARGERS]
                    }
                }
            )
            states = {item['charger_id']: item for item in response.get('Responses', {}).get(table_name, [])}
            return states

        def process_charger_state(charger_id, state, current_synth_epoch, index):
            event_time = get_event_timestamp(current_synth_epoch, index)
            payloads = []
            
            hardware = CHARGER_SPECS[charger_id]
            current_power_kw = hardware["power_kw"]
            base_volts = hardware["voltage"]
            target_amps = float(current_power_kw * 1000) / base_volts
            
            simulated_hour = datetime.fromtimestamp(current_synth_epoch, timezone.utc).hour
            
            # ---> UPDATED: 40% Day Traffic, 20% Night Traffic <---
            if 7 <= simulated_hour <= 19:
                traffic_chance = 0.40  
            else:
                traffic_chance = 0.20  
            
            if not state:
                state = {
                    'charger_id': charger_id,
                    'status': 'AVAILABLE',
                    'session_id': None,
                    'vehicle_id': None,
                    'energy_kwh_total': Decimal('0.0'),
                    'target_energy_kwh': Decimal('0.0'),
                    'last_update_epoch': Decimal(str(current_synth_epoch)),
                    'fault_clear_epoch': None,
                    'active_fault': None,
                    'active_connector': 1 
                }

            last_update = float(state['last_update_epoch'])
            delta_synthetic_seconds = current_synth_epoch - last_update
            delta_synthetic_minutes = delta_synthetic_seconds / 60.0
            
            status = state['status']
            active_conn = int(state.get('active_connector', 1))
            
            # ---------------------------------------------------------
            # STATE: AVAILABLE
            # ---------------------------------------------------------
            if status == 'AVAILABLE':
                if random.random() < traffic_chance: 
                    state['status'] = 'CHARGING'
                    state['session_id'] = f"sess-{datetime.fromtimestamp(current_synth_epoch, timezone.utc).strftime('%Y%m%d')}-{random.randint(1000,9999)}"
                    state['vehicle_id'] = f"veh-{random.randint(100, 999)}"
                    state['energy_kwh_total'] = Decimal('0.0')
                    
                    active_conn = random.choice([1, 2])
                    state['active_connector'] = active_conn
                    
                    random_target = round(random.uniform(5.0, 50.0), 1)
                    state['target_energy_kwh'] = Decimal(str(random_target))
                    
                    payloads.append({
                        "event_type": "session",
                        "payload": {"connector_id": active_conn, "session_id": state['session_id'], "vehicle_id": state['vehicle_id'], "state": "starting", "power_kw": 0.0, "energy_kwh_total": 0.0}
                    })
                else:
                    payloads.append({
                        "event_type": "telemetry",
                        "payload": {
                            "connector_id": active_conn, "status": "available", 
                            "temperature_c": round(random.uniform(20.0, 23.0), 1), 
                            "voltage_v": round(random.uniform(base_volts - 2, base_volts + 2), 1), 
                            "current_a": 0.0
                        }
                    })

            # ---------------------------------------------------------
            # STATE: CHARGING
            # ---------------------------------------------------------
            elif status == 'CHARGING':
                if random.random() < 0.10: 
                    chosen_fault = random.choice(POSSIBLE_FAULTS)
                    
                    payloads.append({
                        "event_type": "fault",
                        "payload": {"connector_id": active_conn, "fault_code": chosen_fault["code"], "severity": chosen_fault["sev"], "message": chosen_fault["msg"]}
                    })
                    
                    state['status'] = 'FAULTED'
                    state['active_fault'] = chosen_fault
                    state['fault_clear_epoch'] = Decimal(str(current_synth_epoch + (30 * 60)))
                
                else:
                    energy_added = (current_power_kw / Decimal('60.0')) * Decimal(str(delta_synthetic_minutes))
                    state['energy_kwh_total'] += energy_added
                    
                    if state['energy_kwh_total'] >= state['target_energy_kwh']:
                        payloads.append({
                            "event_type": "session",
                            "payload": {"connector_id": active_conn, "session_id": state['session_id'], "vehicle_id": state['vehicle_id'], "state": "completed", "power_kw": 0.0, "energy_kwh_total": float(state['energy_kwh_total'])}
                        })
                        state['status'] = 'AVAILABLE'
                        state['session_id'] = None
                        state['vehicle_id'] = None
                        state['energy_kwh_total'] = Decimal('0.0')
                        state['target_energy_kwh'] = Decimal('0.0')
                        state['active_fault'] = None
                        
                    else:
                        payloads.append({
                            "event_type": "telemetry",
                            "payload": {
                                "connector_id": active_conn, "status": "charging", 
                                "temperature_c": round(random.uniform(38.0, 44.0), 1), 
                                "voltage_v": round(random.uniform(base_volts - 5, base_volts + 5), 1), 
                                "current_a": round(random.uniform(target_amps - 2, target_amps + 2), 1)
                            }
                        })
                        payloads.append({
                            "event_type": "session",
                            "payload": {"connector_id": active_conn, "session_id": state['session_id'], "vehicle_id": state['vehicle_id'], "state": "charging", "power_kw": float(current_power_kw), "energy_kwh_total": float(state['energy_kwh_total'])}
                        })

            # ---------------------------------------------------------
            # STATE: FAULTED
            # ---------------------------------------------------------
            elif status == 'FAULTED':
                if current_synth_epoch >= float(state['fault_clear_epoch']):
                    state['status'] = 'AVAILABLE'
                    state['fault_clear_epoch'] = None
                    state['active_fault'] = None
                    
                    if state['session_id']:
                        payloads.append({
                            "event_type": "session",
                            "payload": {"connector_id": active_conn, "session_id": state['session_id'], "vehicle_id": state['vehicle_id'], "state": "completed", "power_kw": 0.0, "energy_kwh_total": float(state['energy_kwh_total'])}
                        })
                        state['session_id'] = None
                        state['vehicle_id'] = None
                        state['energy_kwh_total'] = Decimal('0.0')
                        state['target_energy_kwh'] = Decimal('0.0')
                else:
                    active_fault = state.get('active_fault') or POSSIBLE_FAULTS[0]
                    
                    payloads.append({
                        "event_type": "telemetry",
                        "payload": {
                            "connector_id": active_conn, "status": "faulted", 
                            "temperature_c": round(random.uniform(44.0, 46.0), 1) if active_fault['code'] == 'E_TEMP_HIGH' else round(random.uniform(22.0, 25.0), 1), 
                            "voltage_v": round(random.uniform(base_volts - 2, base_volts + 2), 1), 
                            "current_a": 0.0
                        }
                    })

            state['last_update_epoch'] = Decimal(str(current_synth_epoch))
            
            events = []
            for p in payloads:
                events.append({
                    "event_id": generate_event_id(),
                    "event_time": event_time,
                    "charger_id": charger_id,
                    "event_type": p["event_type"],
                    "payload": p["payload"]
                })
                
            return state, events

        def handler(event, context):
            current_synth_epoch = get_current_synthetic_epoch()
            states = fetch_states()
            
            updated_states = []
            all_events = []
            
            for i, charger_id in enumerate(CHARGERS):
                current_state = states.get(charger_id)
                new_state, events = process_charger_state(charger_id, current_state, current_synth_epoch, i)
                updated_states.append(new_state)
                all_events.extend(events)

            with table.batch_writer() as batch:
                for state in updated_states:
                    batch.put_item(Item=state)

            entries = [{'Id': str(uuid.uuid4()), 'MessageBody': json.dumps(evt, cls=DecimalEncoder)} for evt in all_events]
            
            successful = 0
            for i in range(0, len(entries), 10):
                batch_entries = entries[i:i+10]
                response = sqs.send_message_batch(QueueUrl=queue_url, Entries=batch_entries)
                successful += len(response.get('Successful', []))
                
            print(f"Sent batch. Total Successful: {successful}/{len(entries)}")
            
            return {
                "statusCode": 200,
                "body": f"Processed 10 chargers. Generated {len(entries)} events."
            }

Outputs:
  QueueURL:
    Description: "URL of the Ingest SQS Queue"
    Value: !Ref MdpPocIngestQueue
  ProducerLambdaArn:
    Description: "ARN of the Producer Lambda Function"
    Value: !GetAtt MdpPocProducerFunction.Arn
